<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ===================== Primary meta ===================== -->
    <title>SLICE v26 | National Level Technical Symposium | ECE, LICET Chennai</title>
    <meta
      name="description"
      content="SLICE v26 — the National Level Technical Symposium of the Department of Electronics & Communication Engineering, LICET Chennai. 11 events, a Generative AI masterclass and ₹51,000 in prizes. 22 August 2026."
    />
    <meta name="theme-color" content="#F5EFE0" />
    <meta name="author" content="Department of Electronics & Communication Engineering, LICET" />

    <!--
      TODO before launch: replace https://slice2026.vercel.app with your real
      production domain in the canonical, og:url, og:image, twitter:image,
      sitemap.xml and robots.txt. Social previews will not render until the
      og:image URL is absolute and publicly reachable.
    -->
    <link rel="canonical" href="https://slice2026.vercel.app/" />

    <!-- ===================== Open Graph ===================== -->
    <!-- Without these, the link renders bare in WhatsApp, Instagram DMs and
         LinkedIn — which is how a symposium actually spreads. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SLICE v26" />
    <meta property="og:title" content="SLICE v26 — National Level Technical Symposium" />
    <meta
      property="og:description"
      content="11 events, a Generative AI masterclass and ₹51,000 in prizes. 22 August 2026, Main Auditorium, LICET Chennai."
    />
    <meta property="og:url" content="https://slice2026.vercel.app/" />
    <meta property="og:image" content="https://slice2026.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SLICE v26 — vintage engraving of laboratory equipment above the symposium title" />
    <meta property="og:locale" content="en_IN" />

    <!-- ===================== Twitter / X ===================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SLICE v26 — National Level Technical Symposium" />
    <meta
      name="twitter:description"
      content="11 events, a Generative AI masterclass and ₹51,000 in prizes. 22 August 2026, LICET Chennai."
    />
    <meta name="twitter:image" content="https://slice2026.vercel.app/og-image.jpg" />

    <!-- ===================== Fonts ===================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Great+Vibes&family=Special+Elite&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Icons are inline SVG (src/Icon.jsx). The Font Awesome CDN stylesheet
         was removed: it was a render-blocking third-party request pulling two
         webfonts (~350 KB) to draw 29 glyphs that now cost ~6 KB. -->

    <!-- ===================== Structured data ===================== -->
    <!-- schema.org/Event. A symposium with a fixed date, venue and organiser is
         the textbook case, and it can earn a rich result in search. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "SLICE v26 — National Level Technical Symposium",
        "description": "The annual technical symposium of the Department of Electronics & Communication Engineering at Loyola-ICAM College of Engineering and Technology. Eleven events spanning coding, circuit design, cryptography and startup pitching, plus a hands-on Generative AI masterclass.",
        "startDate": "2026-08-22T09:00:00+05:30",
        "endDate": "2026-08-22T18:00:00+05:30",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "image": ["https://slice2026.vercel.app/og-image.jpg"],
        "url": "https://slice2026.vercel.app/",
        "location": {
          "@type": "Place",
          "name": "Main Auditorium, Loyola-ICAM College of Engineering and Technology",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Loyola Campus, Nungambakkam",
            "addressLocality": "Chennai",
            "addressRegion": "Tamil Nadu",
            "postalCode": "600034",
            "addressCountry": "IN"
          }
        },
        "organizer": {
          "@type": "CollegeOrUniversity",
          "name": "Department of Electronics & Communication Engineering, LICET",
          "url": "https://www.licet.ac.in/",
          "email": "slice2026@licet.edu.in"
        },
        "offers": {
          "@type": "Offer",
          "url": "https://docs.google.com/forms/d/e/1FAIpQLSenQDNZ2I51vD8Ohyj0ytLwAIxw5GhNUY7WmZ2LJ7CnfSzbkg/viewform?usp=dialog",
          "availability": "https://schema.org/InStock",
          "validFrom": "2026-07-01T00:00:00+05:30",
          "category": "Registration"
        },
        "isAccessibleForFree": true,
        "inLanguage": "en-IN"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
