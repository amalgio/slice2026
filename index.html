<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLICE 2026 | ECE Department</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0F19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }
        img:hover {
            transform: scale(1.01);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/ece_under_construction.jpg" alt="ECE Department - Under Construction">
    </div>
</body>
</html>
